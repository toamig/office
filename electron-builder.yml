appId: com.toamig.office
productName: Office
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
extraResources:
  - from: resources/relay
    to: relay
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/better-sqlite3/**
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: toamig
  repo: office
